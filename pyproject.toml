[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plot-finder"
version = "1.0.0"
description = "Find land parcels in Poland (ULDK/GUGiK) and France (IGN cadastre) by id, address or coordinates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ernest Ilchenko" },
]
keywords = ["cadastre", "parcel", "plot", "geodesy", "poland", "france", "uldk", "ign"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[tool.setuptools.packages.find]
include = ["plot_finder*"]

[project.urls]
Homepage = "https://github.com/ernestilchenko/plot-finder"
Documentation = "https://ernestilchenko.github.io/plot-finder/"
