{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <style>
    .pf-version {
      display: inline-flex;
      align-items: center;
      margin-left: .4rem;
      padding: .1rem .5rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var inner = document.querySelector(".md-header__inner");
      if (!inner) return;
      var badge = document.createElement("span");
      badge.className = "pf-version";
      badge.textContent = "v{{ config.extra.version }}";
      var source = inner.querySelector(".md-header__source");
      if (source) { inner.insertBefore(badge, source); }
      else { inner.appendChild(badge); }
    });
  </script>
{% endblock %}
